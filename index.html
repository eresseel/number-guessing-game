<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számkitaláló játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="outer-wrapper">
    <header>
        <h1>Tippelj a számra!</h1>
        <p class="motto">Találd ki a számot 1 és 100 között!</p>
    </header>

    <main>
        <div class="content-card">
            <form id="guess-form" onsubmit="return false;">
                <label for="guess-input">Add meg a tipped (1–100):</label>
                <input type="number" id="guess-input" min="1" max="100">

                <div class="button-group">
                    <button type="button" id="guess-btn" class="btn btn-primary">Tippelés</button>
                    <button type="button" id="reset-btn" class="btn btn-primary">Új játék</button>
                </div>
            </form>

            <div id="message-container" class="message-container"></div>
            <div class="attempts-container">
                Próbálkozások száma: <span id="attempts-count">0</span>
            </div>
        </div>
    </main>

    <footer>
        <p>Készítő: Béres László | Készítés éve: 2026 | Tanfolyam: Webfejlesztés modulzáró – 2. feladat</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
